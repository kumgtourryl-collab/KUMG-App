<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0f0a">
<title>KUMG</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #070a07;
    color: #d6e8d6;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  header {
    padding: 14px 16px;
    background: #0a0f0a;
    border-bottom: 1px solid #14301a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #22c55e;
  }
  .logo span { color: #d6e8d6; }
  #subjects {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 12px;
    background: #0a0f0a;
    border-bottom: 1px solid #14301a;
    scrollbar-width: none;
    flex-shrink: 0;
  }
  #subjects::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid #14301a;
    background: transparent;
    color: #7a9a7a;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .chip.active {
    background: #14532d;
    border-color: #22c55e;
    color: #d6e8d6;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 88%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .user {
    align-self: flex-end;
    background: #14532d;
    color: #e8f5e8;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: #0d1a0d;
    border: 1px solid #14301a;
    color: #c8dcc8;
    border-bottom-left-radius: 4px;
  }
  .welcome {
    text-align: center;
    color: #4a6a4a;
    font-size: 14px;
    margin-top: 40px;
    line-height: 1.8;
  }
  .welcome b { color: #22c55e; display: block; font-size: 18px; margin-bottom: 8px; letter-spacing: 2px; }
  #inputBar {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: #0a0f0a;
    border-top: 1px solid #14301a;
    flex-shrink: 0;
  }
  #question {
    flex: 1;
    background: #0d1a0d;
    border: 1px solid #14301a;
    border-radius: 22px;
    padding: 12px 16px;
    color: #d6e8d6;
    font-size: 16px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s ease;
  }
  #question:focus { border-color: #22c55e; }
  #sendBtn {
    background: #22c55e;
    border: none;
    border-radius: 50%;
    width: 46px;
    height: 46px;
    color: #061006;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  #sendBtn:disabled { background: #14532d; color: #3a5a3a; cursor: not-allowed; }
  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo">K<span>U</span>M<span>G</span></div>
</header>

<div id="subjects"></div>

<div id="chat">
  <div class="welcome">
    <b>KUMG</b>
    Ask me anything about your school work.<br>
    I'll explain it simply, with examples.
  </div>
</div>

<div id="inputBar">
  <input id="question" type="text" placeholder="Ask a question..." autocomplete="off">
  <button id="sendBtn" aria-label="Send">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>
</div>

<script>
// Your live KUMG backend URL on Render
const BACKEND_URL = "https://kumg-app.onrender.com";

const SUBJECTS = ["General", "Maths", "Biology", "Chemistry", "Physics", "English", "History", "Geography", "Accounts"];
let subject = "General";
let history = [];

const chat = document.getElementById("chat");
const questionEl = document.getElementById("question");
const sendBtn = document.getElementById("sendBtn");
const subjectsEl = document.getElementById("subjects");

SUBJECTS.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "chip" + (i === 0 ? " active" : "");
  b.textContent = s;
  b.onclick = () => {
    subject = s;
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    b.classList.add("active");
  };
  subjectsEl.appendChild(b);
});

function addMsg(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function ask() {
  const q = questionEl.value.trim();
  if (!q) return;

  addMsg(q, "user");
  questionEl.value = "";
  sendBtn.disabled = true;

  const loader = addMsg("", "bot");
  loader.innerHTML = '<svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>';

  history.push({ role: "user", content: q });

  try {
    const res = await fetch(`${BACKEND_URL}/api/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, subject, history: history.slice(-6) })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");

    loader.textContent = data.answer;
    history.push({ role: "assistant", content: data.answer });

  } catch (e) {
    loader.textContent = "System Error: " + e.message;
  }

  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.onclick = ask;
questionEl.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>
