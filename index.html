<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0f0a">
<title>KUMG</title>
<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #070a07; color: #d6e8d6; display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  header { padding: 14px 16px; background: #0a0f0a; border-bottom: 1px solid #14301a; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: 4px; color: #22c55e; }
  .logo span { color: #d6e8d6; }
  #authBtn { background: none; border: 1px solid #14301a; border-radius: 8px; padding: 6px 12px; color: #5a7a5a; font-size: 13px; cursor: pointer; }
  #subjects { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px; background: #0a0f0a; border-bottom: 1px solid #14301a; scrollbar-width: none; flex-shrink: 0; }
  #subjects::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 7px 14px; border-radius: 20px; border: 1px solid #14301a; background: transparent; color: #7a9a7a; font-size: 13px; cursor: pointer; }
  .chip.active { background: #14532d; border-color: #22c55e; color: #d6e8d6; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 12px 16px; border-radius: 14px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .user { align-self: flex-end; background: #14532d; color: #e8f5e8; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #0d1a0d; border: 1px solid #14301a; color: #c8dcc8; border-bottom-left-radius: 4px; }
  .welcome { text-align: center; color: #4a6a4a; font-size: 14px; margin-top: 40px; line-height: 1.8; }
  .welcome b { color: #22c55e; display: block; font-size: 18px; margin-bottom: 8px; letter-spacing: 2px; }
  #inputBar { background: #0a0f0a; border-top: 1px solid #14301a; padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  #question { width: 100%; background: #0d1a0d; border: 1px solid #14301a; border-radius: 16px; padding: 12px 16px; color: #d6e8d6; font-size: 16px; outline: none; }
  #question:focus { border-color: #22c55e; }
  #inputBottom { display: flex; align-items: center; justify-content: space-between; }
  .chip-action { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 16px; border: 1px solid #14301a; background: transparent; color: #7a9a7a; font-size: 13px; cursor: pointer; }
  .chip-action.active { background: #14532d; border-color: #22c55e; color: #d6e8d6; }
  .chip-action svg { width: 14px; height: 14px; }
  .action-buttons { display: flex; gap: 8px; align-items: center; }
  .icon-btn { background: transparent; border: 1px solid #14301a; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; color: #7a9a7a; cursor: pointer; }
  #sendBtn { background: #22c55e; border: none; border-radius: 50%; width: 42px; height: 42px; color: #061006; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #sendBtn:disabled { background: #14532d; color: #3a5a3a; }
  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; backdrop-filter: blur(4px); }
  #modal.show { display: flex; }
  .card { background: #0d1a0d; border: 1px solid #14301a; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; }
  .card h2 { margin: 0 0 8px; color: #22c55e; font-size: 16px; text-transform: uppercase; }
  .card p { color: #5a7a5a; font-size: 13px; margin: 0 0 20px; }
  .card input { width: 100%; background: #070a07; border: 1px solid #14301a; border-radius: 10px; padding: 14px; color: #d6e8d6; font-size: 15px; margin-bottom: 12px; outline: none; }
  .card button { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #22c55e; color: #061006; font-weight: 700; font-size: 15px; cursor: pointer; margin-bottom: 8px; }
  .card .link { color: #22c55e; cursor: pointer; text-decoration: underline; font-size: 13px; text-align: center; display: block; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo">K<span>U</span>M<span>G</span></div>
  <button id="authBtn">Login</button>
</header>

<div id="subjects"></div>
<div id="chat">
  <div class="welcome">
    <b>KUMG</b> Ask me anything about your school work.
  </div>
</div>

<div id="inputBar">
  <input id="question" type="text" placeholder="Ask a question..." autocomplete="off">
  <div id="inputBottom">
    <div style="display:flex; gap:6px;">
      <button class="chip-action" id="thinkBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 0 1 4 4c0 1.95-1.4 3.58-3.25 3.93L12 10v2m0-10a4 4 0 0 0-4 4c0 1.95 1.4 3.58 3.25 3.93L12 10v2m0 0v10m-4-8h8"/></svg> Think</button>
      <button class="chip-action" id="searchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Search</button>
      <button class="chip-action" id="quizBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Quiz Me</button>
    </div>
    <div class="action-buttons">
      <button id="sendBtn" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
    </div>
  </div>
</div>

<div id="modal">
  <div class="card">
    <h2 id="modalTitle">KUMG Login</h2>
    <p id="modalDesc">Sign in to save your study history.</p>
    <input id="emailInput" type="email" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Password">
    <button id="authSubmit">Login</button>
    <span class="link" id="toggleAuth">Don't have an account? Sign up</span>
  </div>
</div>

<script>
// ⚠️ REPLACE WITH YOUR SUPABASE URL AND KEY
const SUPABASE_URL = "https://mzwfpgmgofhkjplexsam.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8xuNROZulsGa7GL94cSAGA_D04QsR2Y";
const BACKEND_URL = "https://kumg-app.onrender.com";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let subject = "General";
let history = [];
let isThink = false;
let isSearch = false;

// UI Elements
const chat = document.getElementById("chat");
const questionEl = document.getElementById("question");
const sendBtn = document.getElementById("sendBtn");
const subjectsEl = document.getElementById("subjects");
const authBtn = document.getElementById("authBtn");
const modal = document.getElementById("modal");
const authSubmit = document.getElementById("authSubmit");
const toggleAuth = document.getElementById("toggleAuth");
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const modalTitle = document.getElementById("modalTitle");
const modalDesc = document.getElementById("modalDesc");
let isLoginMode = true;

// Setup Subjects
["General", "Maths", "Biology", "Chemistry", "Physics", "English", "History", "Geography", "Accounts"].forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "chip" + (i === 0 ? " active" : "");
  b.textContent = s;
  b.onclick = () => { subject = s; document.querySelectorAll(".chip").forEach(c => c.classList.remove("active")); b.classList.add("active"); };
  subjectsEl.appendChild(b);
});

// Auth Logic
authBtn.onclick = () => modal.classList.add("show");
toggleAuth.onclick = () => {
  isLoginMode = !isLoginMode;
  modalTitle.textContent = isLoginMode ? "KUMG Login" : "KUMG Sign Up";
  authSubmit.textContent = isLoginMode ? "Login" : "Create Account";
  toggleAuth.textContent = isLoginMode ? "Don't have an account? Sign up" : "Already have an account? Login";
};

authSubmit.onclick = async () => {
  const email = emailInput.value;
  const password = passwordInput.value;
  authSubmit.disabled = true;
  authSubmit.textContent = "Please wait...";

  if (isLoginMode) {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) alert(error.message);
  } else {
    const { data, error } = await supabase.auth.signUp({ email, password });
    if (error) alert(error.message);
    else alert("Check your email for the confirmation link!");
  }
  authSubmit.disabled = false;
  authSubmit.textContent = isLoginMode ? "Login" : "Create Account";
};

// Check Auth State
supabase.auth.onAuthStateChange((event, session) => {
  if (session) {
    currentUser = session.user;
    authBtn.textContent = "Logout";
    modal.classList.remove("show");
    loadHistory();
  } else {
    currentUser = null;
    authBtn.textContent = "Login";
    chat.innerHTML = '<div class="welcome"><b>KUMG</b> Ask me anything about your school work.</div>';
  }
});

authBtn.onclick = () => {
  if (currentUser) {
    supabase.auth.signOut();
  } else {
    modal.classList.add("show");
  }
};

// Load History from Supabase
async function loadHistory() {
  if (!currentUser) return;
  const { data, error } = await supabase.from('chats').select('*').order('created_at', { ascending: true }).limit(50);
  if (error) return console.error(error);
  
  chat.innerHTML = '<div class="welcome"><b>KUMG</b> Welcome back. Continue your studies.</div>';
  history = [];
  data.forEach(msg => {
    addMsg(msg.content, msg.role === 'user' ? 'user' : 'bot');
    history.push({ role: msg.role, content: msg.content });
  });
}

// Add Message to UI
function addMsg(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

// Save Message to Supabase
async function saveMsg(content, role) {
  if (!currentUser) return;
  await supabase.from('chats').insert([{ user_id: currentUser.id, content, role }]);
}

// Ask AI
async function ask() {
  const q = questionEl.value.trim();
  if (!q) return;

  addMsg(q, "user");
  saveMsg(q, "user");
  questionEl.value = "";
  sendBtn.disabled = true;

  const loader = addMsg("", "bot");
  loader.innerHTML = '<svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>';

  history.push({ role: "user", content: q });

  try {
    const res = await fetch(`${BACKEND_URL}/api/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, subject, history: history.slice(-6), think: isThink, search: isSearch })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");

    loader.textContent = data.answer;
    history.push({ role: "assistant", content: data.answer });
    saveMsg(data.answer, "assistant");
  } catch (e) {
    loader.textContent = "System Error: " + e.message;
  }

  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

// Quiz Me
document.getElementById("quizBtn").onclick = async () => {
  if (history.length === 0) return alert("Ask KUMG some questions first so it can generate a quiz for you!");
  
  sendBtn.disabled = true;
  const loader = addMsg("Generating quiz based on your recent study session...", "bot");
  loader.innerHTML = '<svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>';

  try {
    const res = await fetch(`${BACKEND_URL}/api/quiz`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ subject, history: history.slice(-6) })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    loader.textContent = data.answer;
  } catch (e) {
    loader.textContent = "Error generating quiz: " + e.message;
  }
  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
};

// Toggles
document.getElementById("thinkBtn").onclick = () => { isThink = !isThink; document.getElementById("thinkBtn").classList.toggle("active", isThink); };
document.getElementById("searchBtn").onclick = () => { isSearch = !isSearch; document.getElementById("searchBtn").classList.toggle("active", isSearch); };

sendBtn.onclick = ask;
questionEl.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

// Keyboard Fix
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => { document.body.style.height = window.visualViewport.height + 'px'; });
}
</script>
</body>
</html>
